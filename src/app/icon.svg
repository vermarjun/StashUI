<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .mark { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) { .mark { fill: #fafafa; } }
  </style>
  <!-- a stash: three stacked sheets, tightest at the top -->
  <g class="mark">
    <rect x="6" y="6" width="20" height="4.5" rx="2.25" opacity="0.45" />
    <rect x="6" y="13.75" width="20" height="4.5" rx="2.25" opacity="0.72" />
    <rect x="6" y="21.5" width="20" height="4.5" rx="2.25" />
  </g>
</svg>
