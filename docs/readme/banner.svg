<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#26262b"/>
    </pattern>
    <radialGradient id="fade" cx="78%" cy="45%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="1280" height="440" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd60a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffd60a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vortex" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.45" stop-color="#1d4ed8"/>
      <stop offset="0.8" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="440" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="#09090b"/>
    <rect width="1280" height="440" fill="url(#dots)" mask="url(#dotmask)"/>
    <circle cx="960" cy="220" r="360" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="23.5" fill="none" stroke="#232327"/>

  <!-- copy -->
  <text x="72" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3.5" fill="#ffd60a">AGENTIC UI LIBRARY</text>
  <text x="68" y="206" font-size="88" font-weight="700" letter-spacing="-3.5" fill="#fafafa">Stash<tspan fill="#a1a1aa">UI</tspan></text>
  <text x="72" y="262" font-size="27" font-weight="500" letter-spacing="-0.4" fill="#e4e4e7">Describe the screen.</text>
  <text x="72" y="298" font-size="27" font-weight="500" letter-spacing="-0.4" fill="#e4e4e7">Your agent picks the parts, by looking.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a1a1aa">
    <rect x="72" y="338" width="162" height="34" rx="17" fill="#131316" stroke="#2a2a2f"/>
    <text x="153" y="360" text-anchor="middle"><tspan fill="#fafafa">1,118</tspan> components</text>
    <rect x="246" y="338" width="150" height="34" rx="17" fill="#131316" stroke="#2a2a2f"/>
    <text x="321" y="360" text-anchor="middle">MCP · HTTP · CLI</text>
    <rect x="408" y="338" width="156" height="34" rx="17" fill="#131316" stroke="#2a2a2f"/>
    <text x="486" y="360" text-anchor="middle">shadcn install</text>
  </g>

  <!-- a sheet, the way an agent receives it -->
  <g transform="translate(676 58)">
    <rect x="-16" y="-16" width="556" height="356" rx="18" fill="#0f0f12" stroke="#26262b"/>

    <!-- 1 hero with colour bars -->
    <g>
      <rect width="168" height="104" rx="8" fill="#141417" stroke="#26262b"/>
      <rect x="14" y="22" width="62" height="7" rx="3.5" fill="#e4e4e7"/>
      <rect x="14" y="34" width="48" height="7" rx="3.5" fill="#e4e4e7"/>
      <rect x="14" y="50" width="70" height="4" rx="2" fill="#52525b"/>
      <rect x="14" y="58" width="58" height="4" rx="2" fill="#52525b"/>
      <rect x="14" y="72" width="34" height="11" rx="5.5" fill="#fafafa"/>
      <rect x="100" y="26" width="54" height="9" rx="3" fill="#a855f7"/>
      <rect x="100" y="40" width="54" height="9" rx="3" fill="#f472b6"/>
      <rect x="100" y="54" width="54" height="9" rx="3" fill="#84cc16"/>
      <rect x="100" y="68" width="54" height="9" rx="3" fill="#a855f7" opacity="0.7"/>
    </g>
    <!-- 2 hero with vortex: the pick -->
    <g transform="translate(184 0)">
      <rect width="168" height="104" rx="8" fill="#141417"/>
      <rect x="14" y="22" width="62" height="7" rx="3.5" fill="#e4e4e7"/>
      <rect x="14" y="34" width="48" height="7" rx="3.5" fill="#e4e4e7"/>
      <rect x="14" y="50" width="70" height="4" rx="2" fill="#52525b"/>
      <rect x="14" y="58" width="58" height="4" rx="2" fill="#52525b"/>
      <rect x="14" y="72" width="34" height="11" rx="5.5" fill="#fafafa"/>
      <circle cx="126" cy="52" r="34" fill="url(#vortex)"/>
      <circle cx="126" cy="52" r="24" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="3 4" opacity="0.8"/>
      <circle cx="126" cy="52" r="14" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="2 3"/>
      <circle cx="126" cy="52" r="6" fill="#020617"/>
      <rect x="-1.5" y="-1.5" width="171" height="107" rx="9.5" fill="none" stroke="#ffd60a" stroke-width="2.5"/>
    </g>
    <!-- 3 liquid metal -->
    <g transform="translate(368 0)">
      <rect width="168" height="104" rx="8" fill="#141417" stroke="#26262b"/>
      <rect x="14" y="22" width="62" height="7" rx="3.5" fill="#e4e4e7"/>
      <rect x="14" y="34" width="48" height="7" rx="3.5" fill="#e4e4e7"/>
      <rect x="14" y="50" width="70" height="4" rx="2" fill="#52525b"/>
      <rect x="14" y="72" width="34" height="11" rx="5.5" fill="#fafafa"/>
      <rect x="98" y="20" width="58" height="62" rx="16" fill="url(#metal)"/>
      <rect x="108" y="32" width="38" height="38" rx="10" fill="none" stroke="#99f6e4" stroke-width="2"/>
    </g>
    <!-- 4 pricing -->
    <g transform="translate(0 150)">
      <rect width="168" height="104" rx="8" fill="#141417" stroke="#26262b"/>
      <rect x="54" y="12" width="60" height="6" rx="3" fill="#e4e4e7"/>
      <rect x="66" y="23" width="36" height="8" rx="4" fill="#27272a"/>
      <rect x="67" y="24" width="18" height="6" rx="3" fill="#d4d4d8"/>
      <g fill="#1c1c20" stroke="#2e2e33">
        <rect x="12" y="38" width="44" height="56" rx="4"/>
        <rect x="62" y="36" width="44" height="60" rx="4" fill="#232327"/>
        <rect x="112" y="38" width="44" height="56" rx="4"/>
      </g>
      <g fill="#fafafa"><rect x="18" y="48" width="18" height="6" rx="2"/><rect x="68" y="46" width="22" height="6" rx="2"/><rect x="118" y="48" width="20" height="6" rx="2"/></g>
      <g fill="#3f3f46"><rect x="18" y="62" width="30" height="3" rx="1.5"/><rect x="18" y="70" width="26" height="3" rx="1.5"/><rect x="68" y="60" width="30" height="3" rx="1.5"/><rect x="68" y="68" width="26" height="3" rx="1.5"/><rect x="118" y="62" width="30" height="3" rx="1.5"/><rect x="118" y="70" width="26" height="3" rx="1.5"/></g>
      <rect x="68" y="84" width="32" height="6" rx="3" fill="#fafafa"/>
    </g>
    <!-- 5 bento -->
    <g transform="translate(184 150)">
      <rect width="168" height="104" rx="8" fill="#141417" stroke="#26262b"/>
      <rect x="10" y="10" width="92" height="44" rx="5" fill="#1c1c20" stroke="#2e2e33"/>
      <rect x="18" y="18" width="52" height="4" rx="2" fill="#a78bfa"/>
      <rect x="18" y="26" width="40" height="4" rx="2" fill="#52525b"/>
      <rect x="108" y="10" width="50" height="44" rx="5" fill="#1c1c20" stroke="#2e2e33"/>
      <rect x="10" y="60" width="50" height="34" rx="5" fill="#1c1c20" stroke="#2e2e33"/>
      <rect x="16" y="66" width="16" height="10" rx="2" fill="#3b82f6"/>
      <rect x="36" y="66" width="16" height="10" rx="2" fill="#10b981"/>
      <rect x="66" y="60" width="92" height="34" rx="5" fill="url(#sunset)" opacity="0.85"/>
    </g>
    <!-- 6 chart -->
    <g transform="translate(368 150)">
      <rect width="168" height="104" rx="8" fill="#141417" stroke="#26262b"/>
      <rect x="14" y="14" width="44" height="5" rx="2.5" fill="#e4e4e7"/>
      <rect x="14" y="24" width="28" height="9" rx="2" fill="#fafafa"/>
      <path d="M14 86 L40 72 L62 78 L88 56 L112 62 L136 40 L156 46" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M14 86 L40 72 L62 78 L88 56 L112 62 L136 40 L156 46 L156 92 L14 92 Z" fill="#f59e0b" opacity="0.12"/>
    </g>

    <!-- number badges, as in a real sheet -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#09090b" text-anchor="middle">
      <rect x="0" y="0" width="24" height="24" fill="#ffd60a"/><text x="12" y="18">1</text>
      <rect x="184" y="0" width="24" height="24" fill="#ffd60a"/><text x="196" y="18">2</text>
      <rect x="368" y="0" width="24" height="24" fill="#ffd60a"/><text x="380" y="18">3</text>
      <rect x="0" y="150" width="24" height="24" fill="#ffd60a"/><text x="12" y="168">4</text>
      <rect x="184" y="150" width="24" height="24" fill="#ffd60a"/><text x="196" y="168">5</text>
      <rect x="368" y="150" width="24" height="24" fill="#ffd60a"/><text x="380" y="168">6</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#a1a1aa">
      <text x="2" y="124">HERO-COLOR-PANEL</text>
      <text x="186" y="124" fill="#ffd60a">HERO-DITHERING</text>
      <text x="370" y="124">HERO-LIQUID-METAL</text>
      <text x="2" y="274">PRICING-TOGGLE</text>
      <text x="186" y="274">BENTO-GRID</text>
      <text x="370" y="274">AREA-CHART</text>
    </g>
    <text x="0" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#71717a">$ stashui search "dark hero for a dev tool"  <tspan fill="#ffd60a">→ picks 2</tspan></text>
  </g>
</svg>
