<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1172" viewBox="0 0 1200 1172" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#ffd60a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1d1d21"/></pattern>
    <clipPath id="frame"><rect width="1200" height="1172" rx="24"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .card { fill: #111114; stroke: #26262b; }
      .cmd { font-size: 21px; font-weight: 700; fill: #fafafa; }
      .arg { fill: #a1a1aa; font-weight: 400; }
      .desc { font-size: 16px; fill: #a1a1aa; }
      .out { font-size: 17px; font-weight: 600; fill: #fafafa; }
      .sub { font-size: 15px; fill: #8b8b94; }
      .badge { fill: #ffd60a; }
      .num { font-size: 19px; font-weight: 700; fill: #09090b; }
      .icon { fill: #18181c; stroke: #2e2e33; }
      .line { stroke: #3f3f46; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="1172" fill="#09090b"/>
    <rect width="1200" height="1172" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="1171" rx="23.5" fill="none" stroke="#232327"/>

  <text x="96" y="62" class="mono" font-size="14" letter-spacing="3" fill="#ffd60a">ONE REQUEST, START TO FINISH</text>
  <text x="1104" y="62" class="mono" font-size="13" fill="#52525b" text-anchor="end">every step is one stashui command</text>

  <!-- the request -->
  <rect x="96" y="88" width="1008" height="80" rx="14" fill="#131316" stroke="#2e2e33"/>
  <rect x="96" y="88" width="5" height="80" rx="2.5" fill="#ffd60a"/>
  <text x="128" y="120" class="mono" font-size="13" letter-spacing="2" fill="#ffd60a">YOU</text>
  <text x="128" y="150" font-size="21" fill="#fafafa">“Build a landing page: header, hero, features, pricing. Dark and calm.”</text>

  <!-- spine -->
  <g class="line" marker-end="url(#arr)">
    <path d="M136 168 V198"/>
    <path d="M136 290 V318"/>
    <path d="M136 410 V438"/>
    <path d="M136 530 V558"/>
    <path d="M136 650 V790"/>
    <path d="M136 882 V910"/>
    <path d="M136 1002 V1036"/>
  </g>

  <!-- 1 context -->
  <g transform="translate(96 200)">
    <rect width="1008" height="90" rx="14" class="card"/>
    <rect x="22" y="27" width="36" height="36" rx="4" class="badge"/><text x="40" y="52" text-anchor="middle" class="mono num">1</text>
    <text x="80" y="42" class="mono cmd">context</text>
    <text x="80" y="68" class="desc">Reads your stack, tokens and the components you already have.</text>
    <line x1="624" y1="18" x2="624" y2="72" stroke="#26262b"/>
    <g transform="translate(650 17)">
      <rect width="56" height="56" rx="12" class="icon"/>
      <path d="M18 12 H33 L40 19 V44 H18 Z" fill="none" stroke="#d4d4d8" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M33 12 V19 H40" fill="none" stroke="#d4d4d8" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M23 26 H35 M23 31 H35 M23 36 H31" stroke="#ffd60a" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="726" y="42" class="mono out">DESIGN.md</text>
    <text x="726" y="66" class="sub">your look, written down once</text>
  </g>

  <!-- 2 search -->
  <g transform="translate(96 320)">
    <rect width="1008" height="90" rx="14" class="card"/>
    <rect x="22" y="27" width="36" height="36" rx="4" class="badge"/><text x="40" y="52" text-anchor="middle" class="mono num">2</text>
    <text x="80" y="42" class="mono cmd">search <tspan class="arg">"dark hero, dev tool"</tspan></text>
    <text x="80" y="68" class="desc">Describe it in words. Matches come back as a picture.</text>
    <line x1="624" y1="18" x2="624" y2="72" stroke="#26262b"/>
    <g transform="translate(650 17)">
      <rect width="56" height="56" rx="12" class="icon"/>
      <g fill="#45454d"><rect x="11" y="15" width="10" height="11" rx="2"/><rect x="23" y="15" width="10" height="11" rx="2"/><rect x="35" y="15" width="10" height="11" rx="2"/><rect x="11" y="30" width="10" height="11" rx="2"/><rect x="23" y="30" width="10" height="11" rx="2"/><rect x="35" y="30" width="10" height="11" rx="2"/></g>
      <g fill="#ffd60a"><rect x="11" y="15" width="4" height="4"/><rect x="23" y="15" width="4" height="4"/><rect x="35" y="15" width="4" height="4"/><rect x="11" y="30" width="4" height="4"/><rect x="23" y="30" width="4" height="4"/><rect x="35" y="30" width="4" height="4"/></g>
    </g>
    <text x="726" y="42" class="out">One image</text>
    <text x="726" y="66" class="sub">a numbered grid, and a line per number</text>
  </g>

  <!-- 3 view -->
  <g transform="translate(96 440)">
    <rect width="1008" height="90" rx="14" class="card"/>
    <rect x="22" y="27" width="36" height="36" rx="4" class="badge"/><text x="40" y="52" text-anchor="middle" class="mono num">3</text>
    <text x="80" y="42" class="mono cmd">view <tspan class="arg">hero-dithering</tspan></text>
    <text x="80" y="68" class="desc">Looks closer at its top two before choosing.</text>
    <line x1="624" y1="18" x2="624" y2="72" stroke="#26262b"/>
    <g transform="translate(650 17)">
      <rect width="56" height="56" rx="12" class="icon"/>
      <rect x="9" y="16" width="38" height="24" rx="2" fill="none" stroke="#d4d4d8" stroke-width="1.6"/>
      <path d="M21.7 16 V40 M34.3 16 V40" stroke="#d4d4d8" stroke-width="1.6"/>
      <g fill="#ffd60a"><circle cx="15.4" cy="28" r="2"/><circle cx="28" cy="25.5" r="2"/><circle cx="40.6" cy="23" r="2"/></g>
    </g>
    <text x="726" y="42" class="out">Six frames</text>
    <text x="726" y="66" class="sub">hover, click and scroll, in one still</text>
  </g>

  <!-- 4 board -->
  <g transform="translate(96 560)">
    <rect width="1008" height="90" rx="14" class="card"/>
    <rect x="22" y="27" width="36" height="36" rx="4" class="badge"/><text x="40" y="52" text-anchor="middle" class="mono num">4</text>
    <text x="80" y="42" class="mono cmd">board <tspan class="arg">header hero features pricing</tspan></text>
    <text x="80" y="68" class="desc">Sees every pick together, the way you will.</text>
    <line x1="624" y1="18" x2="624" y2="72" stroke="#26262b"/>
    <g transform="translate(650 17)">
      <rect width="56" height="56" rx="12" class="icon"/>
      <rect x="12" y="11" width="32" height="6" rx="2" fill="#d4d4d8"/>
      <rect x="12" y="20" width="32" height="12" rx="2" fill="#3b82f6"/>
      <rect x="12" y="35" width="15" height="10" rx="2" fill="#52525b"/>
      <rect x="29" y="35" width="15" height="10" rx="2" fill="#52525b"/>
    </g>
    <text x="726" y="42" class="out">One image</text>
    <text x="726" y="66" class="sub">does this look like one product?</text>
  </g>

  <!-- optional mockup branch -->
  <path d="M136 650 C136 690 150 706 200 706" fill="none" stroke="#ffd60a" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrY)"/>
  <g transform="translate(206 676)">
    <rect width="898" height="78" rx="14" fill="#0d0d0f" stroke="#ffd60a" stroke-opacity="0.55" stroke-dasharray="6 5"/>
    <text x="24" y="32" class="mono" font-size="12.5" letter-spacing="2" fill="#ffd60a">ONLY IF YOU ASK FOR A MOCKUP</text>
    <text x="24" y="58" class="mono" font-size="19" font-weight="700" fill="#fafafa">propose</text>
    <text x="118" y="58" font-size="16" fill="#a1a1aa">A page with each pick playing beside its runners-up. You swap any, then approve.</text>
  </g>
  <path d="M655 754 V788" fill="none" stroke="#ffd60a" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrY)"/>
  <text x="667" y="777" class="mono" font-size="12.5" fill="#a1a1aa">approved</text>

  <!-- 5 add -->
  <g transform="translate(96 792)">
    <rect width="1008" height="90" rx="14" class="card"/>
    <rect x="22" y="27" width="36" height="36" rx="4" class="badge"/><text x="40" y="52" text-anchor="middle" class="mono num">5</text>
    <text x="80" y="42" class="mono cmd">add <tspan class="arg">header hero features pricing</tspan></text>
    <text x="80" y="68" class="desc">One shadcn command installs the whole screen.</text>
    <line x1="624" y1="18" x2="624" y2="72" stroke="#26262b"/>
    <g transform="translate(650 17)">
      <rect width="56" height="56" rx="12" class="icon"/>
      <path d="M15 21 L23 28 L15 35" fill="none" stroke="#ffd60a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M27 36 H41" stroke="#d4d4d8" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <text x="726" y="42" class="out">Source in your repo</text>
    <text x="726" y="66" class="sub">yours to edit, no runtime package</text>
  </g>

  <!-- 6 review, loops back to add -->
  <g transform="translate(96 912)">
    <rect width="1008" height="90" rx="14" class="card"/>
    <rect x="22" y="27" width="36" height="36" rx="4" class="badge"/><text x="40" y="52" text-anchor="middle" class="mono num">6</text>
    <text x="80" y="42" class="mono cmd">review</text>
    <text x="80" y="68" class="desc">Checks the code it wrote, and fixes every FAIL row.</text>
    <line x1="624" y1="18" x2="624" y2="72" stroke="#26262b"/>
    <g transform="translate(650 17)">
      <rect width="56" height="56" rx="12" class="icon"/>
      <path d="M13 19 L16.5 22.5 L22 16" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13 33 L16.5 36.5 L22 30" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M27 19.5 H43 M27 33.5 H39" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="726" y="42" class="out">Counts, not opinions</text>
    <text x="726" y="66" class="sub">it repeats until FAIL is 0</text>
  </g>
  <path d="M96 957 H74 Q62 957 62 945 V849 Q62 837 74 837 H92" fill="none" stroke="#71717a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="48" y="897" class="mono" font-size="12" fill="#71717a" text-anchor="middle" transform="rotate(-90 48 897)">fix, re-check</text>

  <!-- done -->
  <g transform="translate(96 1038)">
    <rect width="1008" height="84" rx="14" fill="#0f1a12" stroke="#1f3a26"/>
    <circle cx="40" cy="42" r="18" fill="#4ade80"/>
    <path d="M31 42.5 L37.5 49 L49.5 36" fill="none" stroke="#09090b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="38" font-size="20" font-weight="700" fill="#fafafa">Your screen, built and checked</text>
    <text x="80" y="63" font-size="16" fill="#86a894">Its report lists every pick with the runner-up, so you know what else was on the table.</text>
  </g>
</svg>
