<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1d1d21"/></pattern>
    <clipPath id="frame"><rect width="1200" height="640" rx="24"/></clipPath>
    <radialGradient id="vortex" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1220"/><stop offset="0.45" stop-color="#1d4ed8"/><stop offset="0.8" stop-color="#60a5fa"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#0f172a"/><stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .panel { fill: #111114; stroke: #26262b; }
      .h { font-size: 23px; font-weight: 700; }
      .s { font-size: 15.5px; fill: #8b8b94; }
      .ln { font-size: 14px; fill: #a1a1aa; }
      .nm { fill: #e4e4e7; }
      .tile { fill: #18181c; stroke: #2a2a30; }
      .t1 { fill: #e4e4e7; } .t2 { fill: #52525b; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="640" fill="#09090b"/>
    <rect width="1200" height="640" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="23.5" fill="none" stroke="#232327"/>

  <text x="48" y="62" class="mono" font-size="14" letter-spacing="3" fill="#ffd60a">SAME QUESTION: "A DARK HERO FOR A DEV TOOL"</text>

  <!-- LEFT: text only -->
  <g transform="translate(48 92)">
    <rect width="516" height="500" rx="18" class="panel"/>
    <text x="28" y="48" class="h" fill="#d4d4d8">A text-only component server</text>
    <text x="28" y="74" class="s">The agent gets names and descriptions.</text>

    <rect x="28" y="100" width="460" height="132" rx="10" fill="#0b0b0d" stroke="#232327"/>
    <g class="mono ln">
      <text x="48" y="134" class="nm">hero-section-07</text><text x="206" y="134">Modern hero section</text>
      <text x="48" y="162" class="nm">hero-gradient</text><text x="206" y="162">Hero with gradient background</text>
      <text x="48" y="190" class="nm">hero-animated</text><text x="206" y="190">Animated hero for SaaS</text>
      <text x="48" y="218" class="nm">hero-minimal</text><text x="206" y="218">Clean, minimal hero</text>
    </g>

    <g fill="none" stroke="#3f3f46" stroke-dasharray="5 5">
      <rect x="28" y="252" width="106" height="72" rx="8"/>
      <rect x="146" y="252" width="106" height="72" rx="8"/>
      <rect x="264" y="252" width="106" height="72" rx="8"/>
      <rect x="382" y="252" width="106" height="72" rx="8"/>
    </g>
    <g font-size="30" font-weight="300" fill="#52525b" text-anchor="middle">
      <text x="81" y="299">?</text><text x="199" y="299">?</text><text x="317" y="299">?</text><text x="435" y="299">?</text>
    </g>
    <text x="28" y="364" font-size="16.5" fill="#d4d4d8">Four names it cannot tell apart. It picks one and hopes.</text>

    <rect x="28" y="400" width="460" height="68" rx="12" fill="#1a1011" stroke="#3b1d1f"/>
    <circle cx="60" cy="434" r="14" fill="#f87171"/>
    <path d="M54.5 428.5 L65.5 439.5 M65.5 428.5 L54.5 439.5" stroke="#09090b" stroke-width="2.6" stroke-linecap="round"/>
    <text x="88" y="430" font-size="16" font-weight="600" fill="#fafafa">You find out what it looks like</text>
    <text x="88" y="452" font-size="14.5" fill="#b08a8c">after it is installed, in your browser.</text>
  </g>

  <!-- vs -->
  <circle cx="600" cy="342" r="22" fill="#09090b" stroke="#2e2e33"/>
  <text x="600" y="347.5" text-anchor="middle" class="mono" font-size="14" fill="#71717a">vs</text>

  <!-- RIGHT: StashUI -->
  <g transform="translate(636 92)">
    <rect width="516" height="500" rx="18" fill="#121214" stroke="#ffd60a" stroke-opacity="0.35"/>
    <text x="28" y="48" class="h" fill="#fafafa">Stash<tspan fill="#ffd60a">UI</tspan></text>
    <text x="28" y="74" class="s">The agent gets the picture, and the facts.</text>

    <!-- four real-looking tiles -->
    <g transform="translate(28 100)">
      <rect width="106" height="72" rx="6" class="tile"/>
      <rect x="10" y="22" width="40" height="5" rx="2.5" class="t1"/><rect x="10" y="31" width="30" height="5" rx="2.5" class="t1"/><rect x="10" y="44" width="22" height="8" rx="4" fill="#fafafa"/>
      <rect x="62" y="18" width="34" height="7" rx="2" fill="#a855f7"/><rect x="62" y="29" width="34" height="7" rx="2" fill="#f472b6"/><rect x="62" y="40" width="34" height="7" rx="2" fill="#84cc16"/>
    </g>
    <g transform="translate(146 100)">
      <rect width="106" height="72" rx="6" fill="#18181c"/>
      <rect x="10" y="22" width="40" height="5" rx="2.5" class="t1"/><rect x="10" y="31" width="30" height="5" rx="2.5" class="t1"/><rect x="10" y="44" width="22" height="8" rx="4" fill="#fafafa"/>
      <circle cx="78" cy="36" r="24" fill="url(#vortex)"/>
      <circle cx="78" cy="36" r="16" fill="none" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="2.5 3"/>
      <circle cx="78" cy="36" r="5" fill="#020617"/>
      <rect x="-1.5" y="-1.5" width="109" height="75" rx="7.5" fill="none" stroke="#ffd60a" stroke-width="2.5"/>
    </g>
    <g transform="translate(264 100)">
      <rect width="106" height="72" rx="6" class="tile"/>
      <rect x="10" y="22" width="40" height="5" rx="2.5" class="t1"/><rect x="10" y="31" width="30" height="5" rx="2.5" class="t1"/><rect x="10" y="44" width="22" height="8" rx="4" fill="#fafafa"/>
      <rect x="60" y="14" width="38" height="44" rx="11" fill="url(#metal)"/>
    </g>
    <g transform="translate(382 100)">
      <rect width="106" height="72" rx="6" class="tile"/>
      <g transform="rotate(-8 53 36)"><rect x="8" y="34" width="26" height="30" rx="2" fill="#3f3f46"/><rect x="38" y="30" width="26" height="30" rx="2" fill="#52525b"/><rect x="68" y="34" width="26" height="30" rx="2" fill="#3f3f46"/></g>
      <rect x="10" y="12" width="56" height="6" rx="3" class="t1"/><rect x="10" y="21" width="40" height="6" rx="3" class="t1"/>
    </g>
    <g class="mono" font-size="14" font-weight="700" fill="#09090b" text-anchor="middle">
      <rect x="28" y="100" width="20" height="20" fill="#ffd60a"/><text x="38" y="115">1</text>
      <rect x="146" y="100" width="20" height="20" fill="#ffd60a"/><text x="156" y="115">2</text>
      <rect x="264" y="100" width="20" height="20" fill="#ffd60a"/><text x="274" y="115">3</text>
      <rect x="382" y="100" width="20" height="20" fill="#ffd60a"/><text x="392" y="115">4</text>
    </g>

    <rect x="28" y="188" width="460" height="136" rx="10" fill="#0b0b0d" stroke="#232327"/>
    <g class="mono ln">
      <text x="46" y="220" fill="#ffd60a">1</text><text x="70" y="220" class="nm">hero-color-panel</text><text x="232" y="220">neon bars · 10 colours</text>
      <text x="46" y="248" fill="#ffd60a">2</text><text x="70" y="248" fill="#ffd60a">hero-dithering</text><text x="232" y="248">blue vortex · 1 dep</text>
      <text x="46" y="276" fill="#ffd60a">3</text><text x="70" y="276" class="nm">hero-liquid-metal</text><text x="232" y="276">teal metal · heavy</text>
      <text x="46" y="304" fill="#ffd60a">4</text><text x="70" y="304" class="nm">hero-parallax</text><text x="232" y="304">photos on scroll</text>
    </g>
    <text x="28" y="364" font-size="16.5" fill="#fafafa">It picks #2 by looking, and knows what it costs.</text>

    <rect x="28" y="400" width="460" height="68" rx="12" fill="#0f1a12" stroke="#1f3a26"/>
    <circle cx="60" cy="434" r="14" fill="#4ade80"/>
    <path d="M53 434.5 L58 439.5 L67 429.5" fill="none" stroke="#09090b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="430" font-size="16" font-weight="600" fill="#fafafa">You see what you will get</text>
    <text x="88" y="452" font-size="14.5" fill="#86a894">before a single file is written.</text>
  </g>
</svg>
