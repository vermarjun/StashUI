<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1d1d21"/></pattern>
    <clipPath id="frame"><rect width="1200" height="660" rx="24"/></clipPath>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8b8b94" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .col { font-size: 12.5px; letter-spacing: 2.5px; fill: #71717a; }
      .card { fill: #111114; stroke: #26262b; }
      .file { fill: #0e0e10; stroke: #2a2a2f; }
      .t { font-size: 18px; font-weight: 700; fill: #fafafa; }
      .fn { font-size: 16px; font-weight: 700; fill: #fafafa; }
      .d { font-size: 14.5px; fill: #8b8b94; }
      .code { font-size: 13.5px; fill: #ffd60a; }
      .path { font-size: 14px; fill: #e4e4e7; }
      .wire { fill: none; stroke: #52525b; stroke-width: 1.6; }
      .chip { fill: #18181c; stroke: #2e2e33; }
      .chipt { font-size: 12.5px; fill: #a1a1aa; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="660" fill="#09090b"/>
    <rect width="1200" height="660" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="659" rx="23.5" fill="none" stroke="#232327"/>

  <text x="48" y="58" class="mono" font-size="14" letter-spacing="3" fill="#ffd60a">ONE SOURCE. EVERYTHING ELSE IS GENERATED.</text>

  <text x="48" y="108" class="mono col">WRITTEN BY HAND</text>
  <text x="392" y="108" class="mono col">BUILT ONCE, COMMITTED</text>
  <text x="800" y="108" class="mono col">SERVED FROM ONE SITE</text>

  <!-- wires (drawn first, under cards) -->
  <g class="wire" marker-end="url(#arr)">
    <path d="M328 164 H390"/>
    <path d="M328 248 H352 Q360 248 360 240 V198 Q360 190 368 190 H390"/>
    <path d="M328 332 H390"/>
    <path d="M562 370 V398"/>
    <path d="M732 178 H798"/>
    <path d="M732 196 H758 Q766 196 766 204 V312 Q766 320 774 320 H798"/>
    <path d="M732 462 H798"/>
  </g>
  <g class="mono" font-size="11.5" fill="#71717a">
    <text x="360" y="323" text-anchor="middle">demo</text>
    <text x="574" y="389">frames</text>
  </g>

  <!-- A: hand-written -->
  <g transform="translate(48 130)">
    <rect width="280" height="68" rx="12" class="file"/>
    <text x="20" y="30" class="mono fn">registry.json</text>
    <text x="20" y="52" class="d">one entry per component</text>
  </g>
  <g transform="translate(48 214)">
    <rect width="280" height="68" rx="12" class="file"/>
    <text x="20" y="30" class="mono fn">&lt;name&gt;.tsx</text>
    <text x="20" y="52" class="d">the component itself</text>
  </g>
  <g transform="translate(48 298)">
    <rect width="280" height="68" rx="12" class="file"/>
    <text x="20" y="30" class="mono fn">&lt;name&gt;.demo.tsx</text>
    <text x="20" y="52" class="d">real content, real interactions</text>
  </g>
  <text x="48" y="402" class="d" font-size="13.5"><tspan x="48">Under registry/&lt;category&gt;/. Plain React:</tspan><tspan x="48" dy="20">no next/* imports, theme tokens only.</tspan></text>

  <!-- B: build -->
  <g transform="translate(392 130)">
    <rect width="340" height="100" rx="14" class="card"/>
    <text x="22" y="34" class="t">Registry build</text>
    <text x="318" y="34" class="mono code" text-anchor="end">npm run registry</text>
    <text x="22" y="60" class="d">Validates every component, then writes</text>
    <text x="22" y="80" class="d">the gallery data and the install JSON.</text>
  </g>
  <g transform="translate(392 270)">
    <rect width="340" height="100" rx="14" class="card"/>
    <text x="22" y="34" class="t">Clip capture</text>
    <text x="318" y="34" class="mono code" text-anchor="end">npm run capture</text>
    <text x="22" y="60" class="d">Playwright plays each demo; ffmpeg cuts</text>
    <text x="22" y="80" class="d">a short loop in three sizes, plus a poster.</text>
  </g>
  <g transform="translate(392 400)">
    <rect width="340" height="150" rx="14" class="card"/>
    <text x="22" y="34" class="t">Describe pass</text>
    <text x="318" y="34" class="mono code" text-anchor="end">once per component</text>
    <text x="22" y="60" class="d">A vision model reads six frames of the clip</text>
    <text x="22" y="80" class="d">and the source, and writes ~30 facts:</text>
    <text x="22" y="100" class="d">what it is, how it moves, what it costs.</text>
    <g class="mono">
      <rect x="22" y="116" width="72" height="24" rx="12" class="chip"/><text x="58" y="132" class="chipt" text-anchor="middle">records</text>
      <rect x="102" y="116" width="72" height="24" rx="12" class="chip"/><text x="138" y="132" class="chipt" text-anchor="middle">vectors</text>
      <rect x="182" y="116" width="60" height="24" rx="12" class="chip"/><text x="212" y="132" class="chipt" text-anchor="middle">tiles</text>
      <rect x="250" y="116" width="68" height="24" rx="12" class="chip"/><text x="284" y="132" class="chipt" text-anchor="middle">frames</text>
    </g>
  </g>

  <!-- C: served -->
  <g transform="translate(800 130)">
    <rect width="352" height="100" rx="14" class="card"/>
    <text x="22" y="34" class="t">Gallery</text>
    <text x="330" y="34" class="mono path" text-anchor="end">stashui.vermarjun.xyz</text>
    <text x="22" y="60" class="d">For people: looping clips, live previews,</text>
    <text x="22" y="80" class="d">search by describing, copy the source.</text>
  </g>
  <g transform="translate(800 270)">
    <rect width="352" height="100" rx="14" class="card"/>
    <text x="22" y="34" class="t">Install registry</text>
    <text x="330" y="34" class="mono path" text-anchor="end">/r/&lt;name&gt;.json</text>
    <text x="22" y="60" class="d">For the shadcn CLI, in any project:</text>
    <text x="22" y="80" class="d">code, npm deps, CSS and keyframes.</text>
  </g>
  <g transform="translate(800 400)">
    <rect width="352" height="150" rx="14" fill="#121214" stroke="#ffd60a" stroke-opacity="0.4"/>
    <text x="22" y="34" class="t">Agent API</text>
    <text x="330" y="34" class="mono" font-size="12.5" fill="#ffd60a" text-anchor="end">same six operations</text>
    <g class="mono" font-size="14">
      <text x="22" y="68" fill="#71717a">MCP</text><text x="80" y="68" class="path">/api/mcp</text>
      <text x="22" y="94" fill="#71717a">HTTP</text><text x="80" y="94" class="path">/api/agent/v1</text>
      <text x="22" y="120" fill="#71717a">CLI</text><text x="80" y="120" class="path">/agent/stashui.mjs</text>
    </g>
  </g>

  <text x="48" y="612" class="mono" font-size="13" fill="#71717a">git push main  <tspan fill="#52525b">→</tspan>  GitHub Actions builds  <tspan fill="#52525b">→</tspan>  ships to the server  <tspan fill="#52525b">→</tspan>  health check, or automatic rollback</text>
</svg>
